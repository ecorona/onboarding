<main class="mx-auto max-w-6xl px-4 py-12 sm:px-6">
  <mat-card appearance="outlined" class="rounded-3xl p-4 sm:p-8">
    <mat-card-header>
      <mat-card-subtitle>Inicio</mat-card-subtitle>
      <mat-card-title class="mt-2 text-3xl sm:text-4xl">
        Bienvenido, {{ appService.perfil()?.nombre ?? 'usuario' }}
      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p class="mt-4 max-w-2xl text-slate-600">
        Tu sesión está activa. Desde aquí puedes consultar la información de tu perfil y administrar
        las cuentas de la plataforma.
      </p>
    </mat-card-content>
    <mat-card-actions>
      <a mat-flat-button routerLink="/perfil">Ver mi perfil</a>
      <a mat-button routerLink="/usuarios">Administrar usuarios</a>
    </mat-card-actions>
  </mat-card>
</main>
